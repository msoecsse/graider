name: Classroom Grading

on:
  - push
  - repository_dispatch
  - workflow_dispatch

permissions:
  checks: write
  actions: read
  contents: read

jobs:
  grade:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run Classroom autograder
        id: classroom-autograder
        continue-on-error: true
        run: |
          echo "Replace this placeholder with the course Classroom autograder step."
          echo "The final step maps this step outcome into Graider status vocabulary."

      - name: Write Graider grading result
        if: always()
        env:
          CLASSROOM_OUTCOME: ${{ steps.classroom-autograder.outcome }}
        run: |
          mkdir -p graider-output
          python3 - <<'PY'
          import json
          import os

          outcome = os.environ.get("CLASSROOM_OUTCOME", "")
          status = {
              "success": "passed",
              "failure": "failed",
              "cancelled": "failed",
              "skipped": "skipped",
          }.get(outcome.strip().lower(), "failed")
          result = {
              "schema_version": 1,
              "status": status,
              "checks": [{"name": "Classroom Autograder", "status": status}],
          }
          with open("graider-output/grading-results.json", "w", encoding="utf-8") as output_file:
              json.dump(result, output_file, indent=2)
              output_file.write("\n")
          PY

      - name: Upload Graider grading result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grading-results
          path: graider-output/grading-results.json
