name: Contract-Only Grading

on:
  - push
  - repository_dispatch
  - workflow_dispatch

permissions:
  checks: write
  actions: read
  contents: read

jobs:
  grade:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run course-owned grading infrastructure
        id: external-grader
        continue-on-error: true
        run: |
          echo "Replace this placeholder with the course-owned grading command."

      - name: Write Graider grading result
        if: always()
        run: |
          mkdir -p graider-output
          python3 - <<'PY'
          import json

          result = {
              "schema_version": 1,
              "status": "passed",
              "checks": [{"name": "External Grader", "status": "passed"}],
          }
          with open("graider-output/grading-results.json", "w", encoding="utf-8") as output_file:
              json.dump(result, output_file, indent=2)
              output_file.write("\n")
          PY

      - name: Upload Graider grading result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grading-results
          path: graider-output/grading-results.json
