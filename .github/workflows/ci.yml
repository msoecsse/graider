name: CI
on:
  push:
    branches:
      - master
      - ui-redesign
      - remote-course-v2
  pull_request:

jobs:
  normal-checks:
    name: Normal checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install UI dependencies
        run: npm ci --prefix ui

      - name: Reject skipped and focused tests
        run: npm run test:hygiene

      - name: Generate Electron backend bridges
        run: npm run build:electron-backends

      - name: Typecheck
        run: npm run typecheck:prepared

      - name: UI typecheck
        run: npm --prefix ui run typecheck:prepared

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: UI check formatting
        run: npm --prefix ui run format:check

      - name: Set up Java for real GUI fixtures
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Install real GUI fixture runtime
        run: sudo apt-get update && sudo apt-get install -y xvfb libgtk-3-0t64 libasound2t64

      - name: Verify real JavaFX GUI smoke fixtures
        run: node --import tsx scripts/verify-java-gui-smoke.ts

      - name: Test
        run: npm test

      - name: UI test
        run: npm --prefix ui test

      - name: Build
        run: npm run build

      - name: UI build
        run: npm --prefix ui run build

      - name: Audit dependencies
        run: npm run audit

  grading-cache-safety:
    name: Grading local boundary (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            architecture: x64
            target: Windows x64
          - runner: macos-15
            architecture: arm64
            target: macOS arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - name: Preserve repository line endings
        run: git config --global core.autocrlf false

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          architecture: ${{ matrix.architecture }}
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json

      - name: Verify native target architecture
        run: node -e "if (process.arch !== '${{ matrix.architecture }}') process.exit(1)"

      - name: Install dependencies
        run: npm ci

      - name: Install UI dependencies
        run: npm ci --prefix ui

      - name: Generate Electron backend bridges
        run: npm run build:electron-backends

      - name: Typecheck root
        run: npm run typecheck:prepared

      - name: Typecheck UI
        run: npm --prefix ui run typecheck:prepared

      - name: Test production signing verification without credentials
        working-directory: ui
        run: npx vitest run electron/macProductionSigning.test.ts electron/macProductionBuilder.test.ts electron/macDmgSigning.test.ts

      - name: Test local grading, cache leases, account invalidation and publication safeguards
        working-directory: ui
        env:
          GRAIDER_GRADING_PERFORMANCE: "1"
          GRAIDER_GRADING_BENCHMARK: "1"
        run: >-
          npx vitest run --maxWorkers=2
          electron/gradingStudentRepositoryUpdate.integration.test.ts
          electron/gradingStudentRepositoryUpdateService.test.ts
          src/grading-workspace/GradingWorkspacePublication.test.tsx
          electron/gradingLocalPerformance.integration.test.ts
          electron/gradingPerformance.test.ts
          electron/migrationReconciliationService.test.ts
          electron/courseStartup.integration.test.ts
          electron/remoteCourseDiscovery.test.ts
          src/dashboard/DashboardDataContext.test.tsx
          src/grading-workspace/GradingWorkspaceRoute.test.tsx
          electron/githubClientProvider.test.ts
          electron/gradingStudentEvidenceService.test.ts
          electron/managedCourseLeases.test.ts
          electron/managedLocalRead.integration.test.ts
          electron/managedRuntimeWriteSafety.test.ts
          electron/managedOperationBridge.integration.test.ts
          electron/gradingStudentReportPublicationService.test.ts
          src/grading-workspace/GradingWorkspaceEvidencePanel.test.tsx
          src/grading-workspace/GradingWorkspaceKeyboardShortcuts.test.tsx

      - name: Test actual student Git updates and grading preservation
        run: npx vitest run --maxWorkers=2 tests/unit/grading/grading-student-repository-update.test.ts tests/unit/git/git-command-workspace.test.ts

      - name: Test Review Import local Git evidence and faculty recovery workflow
        run: npx vitest run --maxWorkers=2 tests/unit/review-import

      - name: Test Review Import main-process validation and preview
        working-directory: ui
        run: npx vitest run --maxWorkers=2 electron/reviewImportService.test.ts electron/reviewImportSynchronization.integration.test.ts src/review-import/ReviewImportWorkflow.test.tsx

      - name: Test serial issue orchestrator process and recovery safeguards
        run: npx vitest run --maxWorkers=2 tests/unit/orchestrator.test.ts

  migration-regression:
    name: Migration regression (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
            target: macOS arm64
          - runner: windows-latest
            architecture: x64
            target: Windows x64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - name: Preserve repository line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          architecture: ${{ matrix.architecture }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json
      - name: Verify native target
        run: node -e "if (process.arch !== '${{ matrix.architecture }}' || process.platform !== '${{ matrix.runner == 'windows-latest' && 'win32' || 'darwin' }}') process.exit(1)"
      - run: npm ci
      - run: npm ci --prefix ui
      - run: npm run build:electron-backends
      - run: npm run typecheck:prepared
      - run: npm --prefix ui run typecheck:prepared
      - name: Complete permanent migration regression suite
        run: npm run test:migration
